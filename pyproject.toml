[project]
name = "infovis-course-materials"
version = "0.1.0"
description = "Material del curso CC5208, Visualización de Información"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "adjusttext>=1.3.0",
    "chiricoca",
    "contextily>=1.7.0",
    "esda>=2.6.0",
    "geopandas>=1.1.2",
    "h3>=4.4.2",
    "ipykernel>=7.2.0",
    "libpysal>=4.14.1",
    "mapclassify>=2.10.0",
    "matplotlib>=3.10.8",
    "matplotlib-scalebar>=0.9.0",
    "networkx>=3.4",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pyarrow>=23.0.1",
    "python-ternary>=1.0.8",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "wordcloud>=1.9.6",
]

[tool.uv.sources]
chiricoca = { git = "https://github.com/PLUMAS-research/chiricoca.git" }
